name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running run for the same branch/PR once a newer commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------
  # apps/web + apps/api + packages/* (everything under pnpm workspaces)
  # ---------------------------------------------------------------------
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @clientos/database and @clientos/shared ship pre-compiled dist/ that
      # apps/api's ts-jest config expects to already exist (see its
      # transformIgnorePatterns) — build before testing, not just before running.
      - run: pnpm --filter @clientos/shared build
      - run: pnpm --filter @clientos/database build
      - run: pnpm -r test

  test-api-e2e:
    name: API integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clientos
          POSTGRES_PASSWORD: clientos_test_password
          POSTGRES_DB: clientos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clientos -d clientos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://clientos:clientos_test_password@localhost:5432/clientos_test?schema=public"
      SESSION_SECRET: "ci-session-secret-not-for-production-use-only"
      SESSION_COOKIE_NAME: "clientos_session"
      WEB_APP_URL: "http://localhost:3000"
      NODE_ENV: "test"
      API_PORT: "4001"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clientos/shared build
      - run: pnpm --filter @clientos/database build
      - name: Apply schema to clientos_test
        run: pnpm --filter @clientos/database migrate:deploy
      - name: Run API e2e suite
        run: pnpm --filter @clientos/api test:e2e

  # ---------------------------------------------------------------------
  # mobile/ (separate Gradle multi-module project, not a pnpm workspace)
  # ---------------------------------------------------------------------
  mobile-core:
    name: Android – core-network (pure Kotlin/JVM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core-network:test --no-daemon

  mobile-app:
    name: Android – app module (requires Android SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --no-daemon
